appId: com.ridefinder.app
---
# Customer flow (PRD Prompt 5): anonymous browsing -> search -> listing
# detail -> authentication gate -> rider details -> request submission.
#
# Authentication is email + password (see src/features/auth/session.ts) —
# this flow signs up a fresh test address inline via the auth gate, so it
# needs no test-inbox integration or out-of-band code retrieval.
#
# ASSUMPTION: this only reaches rider-details-form when the Supabase
# project's "Confirm email" setting is off, so sign-up returns a session
# immediately. With confirmation required, sign-up instead shows
# 'inline-auth-info' and returns to the sign-in step -- this flow does not
# handle that case (no test-inbox integration exists to click the link).

- launchApp:
    clearState: true

# Fresh install lands on role-select. Choosing "customer" goes straight
# into anonymous browsing (see src/features/auth/computeAppGate.ts) — no
# sign-in required to search, view listings, or get a quote.
- tapOn:
    id: 'role-select-customer'

- assertVisible:
    id: 'search-form'

- tapOn:
    id: 'search-form-location'
- inputText: 'Male'

- tapOn:
    id: 'search-form-submit'

- assertVisible:
    id: 'search-results'

- tapOn:
    id: 'vehicle-result-.*'
    index: 0

- assertVisible:
    id: 'listing-details'

- assertVisible:
    id: 'listing-payment-notice'

- tapOn:
    id: 'listing-request-to-book'

# Signed out: the checkout screen shows the authentication gate instead of
# the rider-details form.
- assertVisible:
    id: 'inline-auth-gate'

- tapOn:
    id: 'inline-auth-toggle-mode'

- tapOn:
    id: 'inline-auth-email'
- inputText: 'customer@example.com'
- tapOn:
    id: 'inline-auth-password'
- inputText: 'TestPassword1'
- tapOn:
    id: 'inline-auth-confirm-password'
- inputText: 'TestPassword1'
- tapOn:
    id: 'inline-auth-submit'

- assertVisible:
    id: 'rider-details-form'

- assertVisible:
    id: 'rider-details-document-placeholder'

- tapOn:
    id: 'rider-details-full-name'
- inputText: 'Test Rider'

- assertVisible:
    id: 'checkout-payment-notice'

- tapOn:
    id: 'checkout-submit'

# Request-to-book, not instant booking: submission lands on the new
# booking's own detail screen, not a confirmed/paid state.
- assertVisible:
    id: 'booking-summary'
- assertVisible:
    text: 'Requested'
