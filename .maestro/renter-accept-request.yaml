appId: com.ridefinder.app
---
# Renter flow (PRD Prompt 5): sign in -> open the pending booking request
# left by the customer flow -> accept it.
#
# Authentication is email + password (see src/features/auth/session.ts) —
# this renter account is assumed to already exist (created once via
# sign-in.tsx's "Create account" toggle); this flow only signs in.
#
# This flow assumes it runs after customer-search-to-request.yaml has
# already created a 'requested' booking for this renter's organization
# (see search-to-accept.yaml, which chains the two) — it does not create
# one itself.

- launchApp:
    clearState: true

- tapOn:
    id: 'role-select-renter'

- tapOn:
    id: 'sign-in-email'
- inputText: 'renter@example.com'
- tapOn:
    id: 'sign-in-password'
- inputText: 'TestPassword1'
- tapOn:
    id: 'sign-in-continue'

# The bookings inbox defaults to the "Needs action" filter (requested +
# needs_info) — the new request is visible without changing filters.
- assertVisible:
    id: 'bookings-list'

- tapOn:
    id: 'booking-item-.*'
    index: 0

- assertVisible:
    id: 'booking-action-panel'

# Accept is a direct action on a 'requested' booking (see ActionPanel.tsx)
# — no separate confirm step, unlike decline/needs_info/cancel.
- tapOn:
    id: 'booking-action-accept'

- assertVisible:
    text: 'Accepted'
